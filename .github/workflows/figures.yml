# Keeps images/ in sync with benchmarks/average_benchmark.md.
#
# - On a pull request: validates the markdown tables and renders the figures,
#   uploaded as the "benchmark-figures" artifact so reviewers can preview them.
# - On main: re-renders the figures and commits them if anything changed, so
#   contributors never have to commit images themselves.
name: Benchmark figures

on:
  pull_request:
    paths:
      - benchmarks/average_benchmark.md
      - mlx_benchmark/run_viz.py
  push:
    branches: [main]
    paths:
      - benchmarks/average_benchmark.md
      - mlx_benchmark/run_viz.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          pip install matplotlib

      - name: Validate benchmark tables
        run: python mlx_benchmark/run_viz.py --check

      - name: Render figures
        run: python mlx_benchmark/run_viz.py

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-figures
          path: images/

      - name: Commit updated figures
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "Figures already up to date."
          else
            git commit -m "chore: regenerate benchmark figures"
            git push
          fi
